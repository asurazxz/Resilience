[tool.pytest.ini_options]
# `..` puts the repository root on sys.path so every module and test imports
# through the single `backend.app...` root, whether pytest is invoked from the
# repository root or from `backend/`.
pythonpath = [".."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]
